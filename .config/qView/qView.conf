[shortcuts]
copy=Ctrl+C, Ctrl+Ins
decreasespeed=[
delete=Ctrl+Backspace, Del
deletepermanent=Shift+Del
firstfile=Home
flip=Ctrl+F
fullscreen=Ctrl+Shift+F
increasespeed=]
lastfile=End
mirror=F
nextfile=Right, PgUp
nextframe=N
open=Ctrl+O
opencontainingfolder=@Invalid()
